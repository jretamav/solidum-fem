[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solidum-fem"
version = "0.1.0"
description = "A displacement-based finite element framework for research in solid mechanics"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "J. Retama-Velasco", email = "jretamav@comunidad.unam.mx" }
]
license = { text = "LGPL-3.0-or-later" }
keywords = [
    "finite element method",
    "FEM",
    "computational mechanics",
    "solid mechanics",
    "nonlinear mechanics",
    "embedded discontinuity",
    "plasticity",
    "damage mechanics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: GNU Lesser General Public License v3 or later (LGPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pyyaml>=6.0",
    "meshio>=5.3",
    "numba>=0.58",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "sympy>=1.12",
]
# Verificación por soluciones manufacturadas (solidum.verification, ADR
# 0022): SymPy deriva la fuerza de cuerpo y las tracciones de la solución.
verification = [
    "sympy>=1.12",
]
# Backends algebraicos opcionales (ADR 0003, ADR 0017). Sin ellos el
# despachador usa SuperLU (SciPy) y todo funciona; con ellos, la
# factorización —que domina el tiempo de un análisis grande— es multihilo
# y con mejor reordenamiento.
fast = [
    # Intel MKL Pardiso: solver directo multihilo con disección anidada.
    # Wheels para Windows/Linux/macOS, sin compilador.
    "pypardiso>=0.4",
]
# Precondicionador AMG para el solver iterativo (ADR 0018). Wheels para
# Linux/macOS/Windows hasta Python 3.12; en Python 3.14/Windows se compila
# (necesita Visual Studio con C++; ver anexo de la capa algebraica).
iterative = [
    "pyamg>=5.0",
]
# CHOLMOD (Cholesky disperso para matrices SPD) va aparte porque
# scikit-sparse sólo se distribuye como fuente: en Linux pip lo compila
# contra la SuiteSparse del sistema (`apt-get install libsuitesparse-dev`;
# la 0.5 exige SuiteSparse >= 7.4); en Windows, `conda install -c
# conda-forge scikit-sparse`. El backend admite las API 0.4 y 0.5.
cholmod = [
    "scikit-sparse>=0.4",
]

[project.urls]
Homepage = "https://github.com/jretamav/solidum-fem"
Repository = "https://github.com/jretamav/solidum-fem"
Issues = "https://github.com/jretamav/solidum-fem/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["solidum*"]
